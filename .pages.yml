settings:
  hide: true
  
media:
  - name: images
    label: Page Images
    input: content/static/images
    output: /static/images
    categories: [image]
  - name: event_media
    label: Event Media
    input: content/static/event_media
    output: /static/event_media
    categories: [image]
  - name: blog_media
    label: Blog Media
    input: content/static/blog_media
    output: /static/blog_media
    categories: [image]
  - name: documents
    label: Documents
    input: content/static/documents
    output: /static/documents
    categories: [document]
  - name: social_logos
    label: Social Logos
    input: content/static/social_logos
    output: /static/social_logos
    categories: [image]
  - name: sponsor_logos
    label: Sponsor Logos
    input: content/static/sponsor_logos
    output: /static/sponsor_logos
    categories: [image]

content:
  - name: events
    label: Events
    type: collection
    path: content/events
    filename:
      template: "{fields.date}-{fields.eventtype}-{primary}.md"
      field: create
    view:
      fields: [title, date, status, eventtype, speaker]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: status
        label: Status
        type: select
        required: true
        description: Set to published for it to show on the website.
        default: draft
        options:
          values:
            - draft
            - published
      - name: date
        label: Event date
        type: date
        description: The date the event takes place (also used in the filename).
        required: true
        options:
          time: false
          format: "yyyy-MM-dd"
      - name: time
        label: Event time
        type: string
        description: e.g. 18:30-19:30 (Use 24-hour format, no AM/PM)
      - name: eventtype
        label: Event type
        type: select
        required: true
        default: Talk
        options:
          values:
            - Talk
            - Symposium
            - Panel
            - Tour
            - Workshop
            - Social
            - Quiz
            - Garden Party
            - Screening
            - AGM
            - Other
      - name: eventtype_custom
        label: Custom event type (if "Other" selected)
        type: string
        description: Only fill this in when Event type above is set to "Other" (e.g. "Hackathon" or "Lab Visit"). Leave blank otherwise.
      - name: speaker
        label: Speaker
        type: string
      - name: location
        label: Location
        type: select
        description: Select a venue here if the event venue is listed in the dropdown menu (Options with location guides automatically link to their location guides), or choose "Other" to enter a custom venue below.
        options:
          values:
            - Winstanley Lecture Theatre
            - Pfizer Lecture Theatre
            - Other
      - name: location_custom
        label: Custom location (if "Other" selected)
        type: string
        description: Only fill this in when Location above is set to "Other" (e.g. "Babbage Lecture Theatre" or "The Eagle"). Leave blank otherwise.
      - name: body
        label: Body
        type: rich-text
        options:
          media: event_media
      - name: note
        label: Note
        type: text
        description: Optional. A short note displayed on the event listing. e.g. "Non-Trinity members should meet at the Great Gate on Trinity Street at 18:20"
      - name: eventid
        label: Event ID
        type: string
        description: Optional. A unique identifier for this event, so links to related blog posts automatically show on this page. Can be whatever you like, but must be unique across all events. e.g. "2023-10-15-talk-smith". Inputting the same event ID in "Related event ID" on a blog will display a link to the blog on the event page. Multiple blogs can link to the same event, but each event ID must be unique across all events.

  - name: blog
    label: Blog posts
    type: collection
    path: content/blog
    filename:
      template: "{fields.date}-{primary}.md"
      field: create
    view:
      fields: [title, date, status, author]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: status
        label: Status
        type: select
        required: true
        description: Set to published for it to show on the website.
        default: draft
        options:
          values:
            - draft
            - published
      - name: date
        label: Date published
        type: date
        description: Publication date shown on the post and used to sort the blog feed.
        required: true
        options:
          time: false
          format: "yyyy-MM-dd"
      - name: author
        label: Author
        type: string
      - name: body
        label: Body
        type: rich-text
        options:
          media: blog_media
      - name: eventid
        label: Related event ID
        type: string

  - name: pages
    label: Pages
    type: collection
    path: content/pages
    subfolders: false
    filename: "{primary}.md"
    view:
      fields: [title, status, date]
      primary: title
      sort: [title]
    fields:
      - name: title
        label: Title
        type: string
        required: true
        readonly: true
      - name: status
        label: Status
        type: select
        required: true
        description: Set to published for it to show on the website.
        default: draft
        options:
          values:
            - draft
            - published
      - name: date
        label: Date last updated
        type: date
        description: The date this page was last updated.
        options:
          time: false
          format: "yyyy-MM-dd"
      - name: summary
        label: Summary
        type: text
        description: Short description displayed in search engine results and link previews.
      - name: body
        label: Body
        type: rich-text
        options:
          media: images
      - name: template
        label: Template
        type: string
        readonly: true
      - name: url
        label: URL
        type: string
        readonly: true
      - name: save_as
        label: Save as
        type: string
        readonly: true

  - name: location_guides
    label: Location Guides
    type: collection
    path: content/pages/location_guides
    filename: "{primary}.md"
    view:
      fields: [title, status, date]
      primary: title
      sort: [title]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: status
        label: Status
        type: select
        required: true
        description: Set to published for it to show on the website.
        default: draft
        options:
          values:
            - draft
            - published
      - name: date
        label: Date last updated
        type: date
        description: The date this location guide was last updated.
        options:
          time: false
          format: "yyyy-MM-dd"
      - name: summary
        label: Summary
        type: text
        description: Short description displayed in search engine results and link previews.
      - name: map_embed
        label: Google Maps Embed URL
        type: string
        description: For displaying an interactive Google Maps embed at the bottom. Paste only the src URL from Google Maps (Share → Embed a map), e.g. https://www.google.com/maps/embed?pb=...
      - name: body
        label: Body
        type: rich-text
        options:
          media: images
      - name: template
        label: Template
        type: string
        readonly: true
      - name: url
        label: URL
        type: string
        readonly: true
      - name: save_as
        label: Save as
        type: string
        readonly: true