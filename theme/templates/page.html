{% extends "base.html" %}

{% block content %}
  <article class="page-content">
    <h2 class="page-title">{{ page.title }}</h2>
    <div class="page-body">
      {{ page.content }}
    </div>
  </article>

  <!-- Google Maps embed for location guide (if applicable) -->
  {% if page.map_embed %}
  <div class="map-container">
    <iframe
      src="{{ page.map_embed }}"
      width="100%"
      height="400"
      style="border:0;"
      allowfullscreen=""
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>
  </div>
  {% endif %}
{% endblock %}
